name: Werewolf 24/7 Cloud Auto-Healer

on:
  schedule:
    # Backup trigger every 15 minutes
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual or automated dispatch

concurrency:
  group: werewolf-keepalive
  cancel-in-progress: true

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Colab CLI & Dependencies
        run: |
          pip install google-colab-cli

      - name: Configure Colab Credentials
        run: |
          mkdir -p ~/.config/colab-cli
          echo '${{ secrets.COLAB_TOKEN_JSON }}' > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Run 24/7 Continuous KeepAlive & Healer Relay
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python cloud_healer.py --continuous
